server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.0.2.131:3100/loki/api/v1/push

scrape_configs:

  # =========================
  # 🐳 DOCKER CONTAINER LOGS
  # =========================
  - job_name: docker

    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:

      # ✅ FIX: remove leading "/" from container name
      - source_labels: ['__meta_docker_container_name']
        regex: '^/(.*)'
        target_label: container
        replacement: '$1'

      # Image name
      - source_labels: ['__meta_docker_container_image']
        target_label: image

      # Log stream (stdout / stderr)
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream

    pipeline_stages:
      - docker: {}

  # =========================
  # 🟡 HOST LOGS (OPTIONAL)
  # =========================
  - job_name: varlogs
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log