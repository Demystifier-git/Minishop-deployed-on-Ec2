plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

filters:
  instance-state-name: running

hostnames:
  - instance-id

keyed_groups:
  - key: tags.Name
    prefix: tag

compose:
  ansible_connection: amazon.aws.aws_ssm
  ansible_user: ubuntu
  ansible_aws_ssm_region: us-east-1
  ansible_python_interpreter: /usr/bin/python3