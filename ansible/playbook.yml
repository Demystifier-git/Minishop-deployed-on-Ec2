- name: Production Deployment (SSM + Docker)
  hosts: web
  become: true
  gather_facts: false

  vars:
    repo_url: "https://github.com/Demystifier-git/Minishop-deployed-on-Ec2.git"
    repo_branch: "main"
    app_dir: "/opt/minishop"
    ansible_python_interpreter: /usr/bin/python3

  tasks:

    # =========================================================
    # BOOTSTRAP PYTHON (REQUIRED FOR SSM)
    # =========================================================
    - name: Bootstrap Python
      raw: |
        sudo apt-get update -y
        sudo apt-get install -y python3 python3-pip
      changed_when: false

    # =========================================================
    # UPDATE APT CACHE (SAFE NOW)
    # =========================================================
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    # =========================================================
    # INSTALL SYSTEM PACKAGES
    # =========================================================
    - name: Install system packages
      ansible.builtin.apt:
        name:
          - git
          - docker.io
          - docker-compose-plugin
        state: present

    # =========================================================
    # ENABLE DOCKER
    # =========================================================
    - name: Enable Docker
      ansible.builtin.systemd:
        name: docker
        enabled: yes
        state: started

    # =========================================================
    # APP DIRECTORY
    # =========================================================
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory

    # =========================================================
    # CLONE REPO
    # =========================================================
    - name: Clone repo
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: yes

    # =========================================================
    # START CONTAINERS
    # =========================================================
    - name: Start containers
      ansible.builtin.command: docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"

    # =========================================================
    # VERIFY
    # =========================================================
    - name: Check containers
      command: docker ps
      register: docker_output
      changed_when: false

    - name: Show containers
      debug:
        msg: "{{ docker_output.stdout | default('No containers running') }}"