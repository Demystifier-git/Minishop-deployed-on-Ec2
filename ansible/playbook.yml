---
- name: Production Deployment with Docker + AWS Secrets Manager (SSM Safe)
  hosts: all
  become: true
  gather_facts: false

  vars:
    repo_url: "https://github.com/Demystifier-git/Minishop-deployed-on-Ec2.git"
    repo_branch: "main"
    app_dir: "/opt/minishop"
    aws_region: "us-east-1"
    secret_name: "prod/minishop/app"

  tasks:

    # =========================================================
    # BASIC SYSTEM PREP
    # =========================================================

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - git
          - docker.io
          - docker-compose-plugin
          - python3-pip
        state: present

    - name: Install AWS Python dependencies
      ansible.builtin.pip:
        name:
          - boto3
          - botocore
        executable: pip3

    - name: Ensure Docker is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # =========================================================
    # SAFE FACT GATHERING FOR SSM
    # =========================================================

    - name: Gather system facts safely
      ansible.builtin.setup:

    # =========================================================
    # APPLICATION SETUP
    # =========================================================

    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Clone or update application repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: true
        update: true

    # =========================================================
    # AWS SECRETS MANAGER
    # =========================================================

    - name: Load secrets from AWS Secrets Manager
      ansible.builtin.set_fact:
        app_secrets: >-
          {{
            lookup(
              'amazon.aws.aws_secret',
              secret_name,
              region=aws_region
            ) | default({}, true)
          }}

    - name: Validate required secrets exist
      ansible.builtin.assert:
        that:
          - app_secrets.DB_USER is defined
          - app_secrets.DB_PASSWORD is defined
          - app_secrets.DB_HOST is defined
          - app_secrets.DB_NAME is defined
        fail_msg: "Missing required database secrets in AWS Secrets Manager"

    # =========================================================
    # CONTAINER DEPLOYMENT
    # =========================================================

    - name: Stop existing containers if running
      ansible.builtin.shell: docker compose down
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: true

    - name: Deploy application with Docker Compose
      ansible.builtin.shell: |
        export DB_USER="{{ app_secrets.DB_USER }}"
        export DB_PASSWORD="{{ app_secrets.DB_PASSWORD }}"
        export DB_HOST="{{ app_secrets.DB_HOST }}"
        export DB_NAME="{{ app_secrets.DB_NAME }}"

        docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"
      register: deploy_output

    - name: Show deployment output
      ansible.builtin.debug:
        var: deploy_output.stdout_lines

    # =========================================================
    # HEALTH CHECK
    # =========================================================

    - name: Wait for services to stabilize
      ansible.builtin.pause:
        seconds: 10

    - name: Check running containers
      ansible.builtin.command: docker ps
      register: containers
      changed_when: false

    - name: Show running containers
      ansible.builtin.debug:
        var: containers.stdout_lines