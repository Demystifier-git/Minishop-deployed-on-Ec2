- name: Production Deployment (SSM + Docker)
  hosts: web
  become: true
  gather_facts: false

  vars:
    repo_url: "https://github.com/Demystifier-git/Minishop-deployed-on-Ec2.git"
    repo_branch: "main"
    app_dir: "/opt/minishop"

  tasks:

    # =========================================================
    # INSTALL SYSTEM PACKAGES USING RAW
    # =========================================================

    - name: Install system packages
      raw: |
        sudo apt-get update -y
        sudo apt-get install -y \
          python3 \
          python3-pip \
          git \
          docker.io \
          docker-compose-plugin

    # =========================================================
    # GATHER FACTS AFTER PYTHON EXISTS
    # =========================================================

    - name: Gather facts
      setup:

    # =========================================================
    # START DOCKER
    # =========================================================

    - name: Start Docker
      raw: |
        sudo systemctl enable docker
        sudo systemctl start docker

    # =========================================================
    # CREATE APP DIRECTORY
    # =========================================================

    - name: Create application directory
      raw: sudo mkdir -p {{ app_dir }}

    # =========================================================
    # CLONE REPOSITORY
    # =========================================================

    - name: Clone repository
      raw: |
        if [ ! -d "{{ app_dir }}/.git" ]; then
          sudo git clone -b {{ repo_branch }} {{ repo_url }} {{ app_dir }}
        else
          cd {{ app_dir }}
          sudo git pull origin {{ repo_branch }}
        fi

    # =========================================================
    # STOP OLD CONTAINERS
    # =========================================================

    - name: Stop containers
      raw: |
        cd {{ app_dir }}
        sudo docker compose down || true

    # =========================================================
    # START APPLICATION
    # =========================================================

    - name: Start containers
      raw: |
        cd {{ app_dir }}
        sudo docker compose up -d --build

    # =========================================================
    # VERIFY CONTAINERS
    # =========================================================

    - name: Verify running containers
      raw: sudo docker ps

      register: docker_output

    - name: Show docker containers
      debug:
        var: docker_output.stdout_lines