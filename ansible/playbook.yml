- name: Production Deployment (SSM + Docker)
  hosts: all
  become: true
  gather_facts: false

  vars:
    repo_url: https://github.com/Demystifier-git/Minishop-deployed-on-Ec2.git
    repo_branch: main
    app_dir: /opt/minishop

  tasks:

    - name: Install system packages
      ansible.builtin.shell: |
        sudo apt update -y
        sudo apt install -y git docker.io docker-compose-plugin python3-pip

    - name: Start Docker
      ansible.builtin.shell: |
        sudo systemctl enable docker
        sudo systemctl start docker

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory

    - name: Clone repo
      ansible.builtin.shell: |
        rm -rf {{ app_dir }}
        git clone {{ repo_url }} {{ app_dir }}

    - name: Deploy app
      ansible.builtin.shell: |
        cd {{ app_dir }}
        docker compose up -d --build

    - name: Show containers
      ansible.builtin.shell: docker ps
      register: containers
      changed_when: false

    - debug:
        var: containers.stdout_lines