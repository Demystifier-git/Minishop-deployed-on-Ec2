- name: Production Deployment (SSM + Docker)
  hosts: aws_ec2
  become: true
  gather_facts: false

  vars:
    repo_url: https://github.com/Demystifier-git/Minishop-deployed-on-Ec2.git
    repo_branch: main
    app_dir: /opt/minishop
    aws_region: us-east-1

  tasks:

    - name: Ensure system packages are installed
      ansible.builtin.apt:
        name:
          - git
          - docker.io
          - docker-compose-plugin
          - python3-pip
        state: present
        update_cache: true

    - name: Ensure Docker is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Clone repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: true

    - name: Restart application
      ansible.builtin.shell: docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"