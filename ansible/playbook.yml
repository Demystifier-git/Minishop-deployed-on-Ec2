- name: Production Deployment (SSM Safe + Docker + AWS Secrets Manager)
  hosts: all
  become: true
  gather_facts: false   # 🔥 IMPORTANT FIX

  vars:
    repo_url: https://github.com/Demystifier-git/Minishop-deployed-on-Ec2.git
    repo_branch: main
    app_dir: /opt/minishop
    aws_region: us-east-1
    secret_name: prod/minishop/app

  tasks:

    # =========================================================
    # SAFE SYSTEM PREP
    # =========================================================

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - git
          - docker.io
          - docker-compose-plugin
          - python3-pip
        state: present

    - name: Ensure Docker is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # =========================================================
    # APP SETUP
    # =========================================================

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Clone repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: true

    # =========================================================
    # AWS SECRETS MANAGER (SAFE)
    # =========================================================

    - name: Load secrets from AWS Secrets Manager
      ansible.builtin.set_fact:
        app_secrets: "{{ lookup('amazon.aws.aws_secret', secret_name, region=aws_region) | default({}) }}"

    - name: Validate secrets
      ansible.builtin.assert:
        that:
          - app_secrets.DB_USER is defined
          - app_secrets.DB_PASSWORD is defined
          - app_secrets.DB_HOST is defined
          - app_secrets.DB_NAME is defined
        fail_msg: "Missing DB secrets"

    # =========================================================
    # DEPLOYMENT
    # =========================================================

    - name: Stop containers
      ansible.builtin.shell: docker compose down || true
      args:
        chdir: "{{ app_dir }}"

    - name: Start application
      ansible.builtin.shell: |
        export DB_USER={{ app_secrets.DB_USER }}
        export DB_PASSWORD={{ app_secrets.DB_PASSWORD }}
        export DB_HOST={{ app_secrets.DB_HOST }}
        export DB_NAME={{ app_secrets.DB_NAME }}

        docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"

    # =========================================================
    # HEALTH CHECK
    # =========================================================

    - name: Show containers
      ansible.builtin.command: docker ps
      register: containers
      changed_when: false

    - debug:
        var: containers.stdout_lines