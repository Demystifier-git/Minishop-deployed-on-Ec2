- name: Production Deployment (SSM + Docker)
  hosts: web
  become: true
  gather_facts: false

  vars:
    repo_url: "https://github.com/Demystifier-git/Minishop-deployed-on-Ec2.git"
    repo_branch: "main"
    app_dir: "/opt/minishop"

  tasks:

    # =========================================================
    # UPDATE APT CACHE (SAFE MODULE)
    # =========================================================
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    # =========================================================
    # INSTALL SYSTEM PACKAGES (NO RAW)
    # =========================================================
    - name: Install system packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - git
          - docker.io
          - docker-compose-plugin
        state: present

    # =========================================================
    # ENABLE & START DOCKER
    # =========================================================
    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: yes
        state: started

    # =========================================================
    # CREATE APP DIRECTORY
    # =========================================================
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    # =========================================================
    # CLONE OR UPDATE REPO
    # =========================================================
    - name: Clone repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: yes

    # =========================================================
    # STOP OLD CONTAINERS
    # =========================================================
    - name: Stop containers
      ansible.builtin.command: docker compose down
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes

    # =========================================================
    # START APPLICATION
    # =========================================================
    - name: Start containers
      ansible.builtin.command: docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"

    # =========================================================
    # VERIFY CONTAINERS
    # =========================================================
    - name: Check running containers
      ansible.builtin.command: docker ps
      register: docker_output
      changed_when: false

    - name: Show containers
      ansible.builtin.debug:
        msg: "{{ docker_output.stdout | default('No containers running') }}"