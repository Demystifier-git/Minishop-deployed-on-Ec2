---
- name: Production Deployment (SSM + Docker)
  hosts: web
  become: true
  gather_facts: false

  vars:
    repo_url: https://github.com/Demystifier-git/Minishop-deployed-on-Ec2.git
    repo_branch: main
    app_dir: /opt/minishop

  tasks:

    - name: Install system packages
      raw: |
        apt-get update &&
        apt-get install -y docker.io docker-compose-plugin git python3 python3-pip
      changed_when: true

    - name: Gather facts
      setup:

    - name: Ensure docker service is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Ensure application directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Clone repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: true

    - name: Stop old containers
      shell: docker compose down
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: true

    - name: Start application
      shell: docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"

    - name: Show running containers
      command: docker ps
      register: docker_output
      changed_when: false

    - name: Print docker containers
      debug:
        var: docker_output.stdout_lines