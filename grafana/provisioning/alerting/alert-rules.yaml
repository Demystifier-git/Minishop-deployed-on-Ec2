apiVersion: 1

groups:

# =========================
# 1. BACKEND AVAILABILITY
# =========================
- name: backend-alerts
  folder: Backend Alerts
  interval: 1m

  rules:
    - uid: backend-down
      title: BackendDown
      condition: A

      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 5
            to: 0
          model:
            expr: sum(up{job="backend"}) == 0
            refId: A

      for: 2m

      annotations:
        summary: Backend is down

      labels:
        severity: critical
        service: backend


    - uid: backend-high-error-rate
      title: BackendHighErrorRate
      condition: A

      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 5
            to: 0
          model:
            expr: |
              (
                sum(rate(http_requests_total{job="backend",status=~"5.."}[5m]))
                /
                sum(rate(http_requests_total{job="backend"}[5m]))
              ) * 100
            refId: A

      for: 5m

      annotations:
        summary: Backend error rate > 5%

      labels:
        severity: warning
        service: backend


    - uid: backend-high-latency
      title: BackendHighLatency
      condition: A

      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 5
            to: 0
          model:
            expr: |
              histogram_quantile(
                0.95,
                sum(rate(http_request_duration_seconds_bucket{job="backend"}[5m])) by (le)
              )
            refId: A

      for: 5m

      annotations:
        summary: Backend p95 latency > 500ms

      labels:
        severity: warning
        service: backend


# =========================
# 2. CPU / MEMORY (OTEL COLLECTOR)
# =========================
- name: node-resource-alerts
  folder: Infrastructure Alerts
  interval: 1m

  rules:

    - uid: high-cpu
      title: HighCPUUsage
      condition: A

      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 5
            to: 0
          model:
            expr: |
              100 * (
                1 - (
                  sum(rate(system_cpu_time_seconds_total{state="idle"}[5m]))
                  /
                  sum(rate(system_cpu_time_seconds_total[5m]))
                )
              ) > 70
            refId: A

      for: 5m

      annotations:
        summary: CPU usage > 70% (OpenTelemetry Collector)

      labels:
        severity: warning
        service: otel


    - uid: high-memory
      title: HighMemoryUsage
      condition: A

      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 5
            to: 0
          model:
            expr: |
              (1 - (system_memory_usage_bytes / system_memory_limit_bytes)) * 100
            refId: A

      for: 5m

      annotations:
        summary: Memory usage > 80%

      labels:
        severity: warning
        service: otel


# =========================
# 3. DISK SATURATION (OTEL)
# =========================
    - uid: disk-almost-full
      title: DiskAlmostFull
      condition: A

      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 5
            to: 0
          model:
            expr: |
              (1 - (
                system_filesystem_usage_bytes
                /
                system_filesystem_limit_bytes
              )) * 100
            refId: A

      for: 10m

      annotations:
        summary: Disk usage > 85%

      labels:
        severity: critical
        service: otel


# =========================
# 4. INSTANCE HEALTH
# =========================
    - uid: instance-down
      title: InstanceDown
      condition: A

      data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 5
            to: 0
          model:
            expr: sum(up) == 0
            refId: A

      for: 2m

      annotations:
        summary: Instance is unreachable

      labels:
        severity: critical
        service: infra


# =========================
# 5. LOKI LOG ALERTS
# =========================
- name: loki-alerts
  folder: Log Alerts
  interval: 1m

  rules:

    - uid: backend-errors
      title: BackendErrorsDetected
      condition: A

      data:
        - refId: A
          datasourceUid: loki
          relativeTimeRange:
            from: 300
            to: 0
          model:
            expr: |
              sum(
                count_over_time(
                  {container="backend"} |= "ERROR" [5m]
                )
              )
            refId: A

      for: 2m

      annotations:
        summary: Backend error logs detected

      labels:
        severity: warning
        service: backend


    - uid: backend-exceptions
      title: BackendExceptions
      condition: A

      data:
        - refId: A
          datasourceUid: loki
          relativeTimeRange:
            from: 300
            to: 0
          model:
            expr: |
              sum(
                count_over_time(
                  {container="backend"} |= "Exception" [5m]
                )
              )
            refId: A

      for: 1m

      annotations:
        summary: Backend exceptions detected

      labels:
        severity: critical
        service: backend


    - uid: backend-no-logs
      title: BackendNoLogs
      condition: A

      data:
        - refId: A
          datasourceUid: loki
          relativeTimeRange:
            from: 300
            to: 0
          model:
            expr: |
              sum(
                count_over_time(
                  {container="backend"}[5m]
                )
              )
            refId: A

      for: 5m

      annotations:
        summary: No backend logs received

      labels:
        severity: critical
        service: backend