global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

 
  # Backend (FastAPI metrics)
  
  - job_name: "backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["api.delightdavid.online"]
    scrape_timeout: 4s

  
  # OTel Collector (App + Infra metrics)
  
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
    scrape_timeout: 4s

  
  # Prometheus self monitoring (PRODUCTION STANDARD)
 
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]