global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: "backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["api.delightdavid.online"]
    scrape_timeout: 4s

  - job_name: "otel-collector"
    metrics_path: /metrics
    static_configs:
      - targets: ["otel.delightdavid.online"]
    scrape_timeout: 4s

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus.delightdavid.online"]