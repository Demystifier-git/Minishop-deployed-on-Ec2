receivers:
  otlp:
    protocols:
      grpc:
      http:

  hostmetrics:
    collection_interval: 10s
    root_path: /hostfs

    scrapers:
      cpu: {}
      memory: {}
      load: {}

      filesystem:
        include_mount_points:
          - /
        exclude_fs_types:
          - tmpfs
          - devtmpfs

      network: {}
      disk: {}

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"

  loki:
    endpoint: http://loki:3100/loki/api/v1/push

  logging:
    verbosity: detailed

service:
  pipelines:

    metrics:
      receivers:
        - otlp
        - hostmetrics
      processors:
        - batch
      exporters:
        - prometheus

    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - loki

    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - logging