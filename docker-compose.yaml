version: "3.8"

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: backend
    restart: unless-stopped

    # IMPORTANT: ALB / EC2 must access this
    ports:
      - "8000:8000"

    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      OTEL_SERVICE_NAME: backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc

    depends_on:
      - otel-collector

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: frontend
    restart: unless-stopped

    # IMPORTANT: if ALB routes to frontend, expose it
    ports:
      - "80:80"

    depends_on:
      - backend

    logging:
      <<: *default-logging


  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped

    # CHANGE: expose → ports (needed for ALB or EC2 access)
    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    logging:
      <<: *default-logging


  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped

    # IMPORTANT for ALB routing
    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"

      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SERVER_PROTOCOL: http

      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST}
      GF_SMTP_USER: ${SMTP_USER}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM}
      GF_SMTP_FROM_NAME: Grafana Alerts
      GF_SMTP_SKIP_VERIFY: "true"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

    depends_on:
      - prometheus
      - loki

    logging:
      <<: *default-logging


  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    restart: unless-stopped

    # internal only (correct)
    expose:
      - "3100"

    command: -config.file=/etc/loki/loki-config.yaml

    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml

    logging:
      <<: *default-logging


  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    restart: unless-stopped

    command: -config.file=/etc/promtail/config.yaml

    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      - loki

    logging:
      <<: *default-logging


  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    container_name: otel-collector
    restart: unless-stopped

    command:
      - "--config=/etc/otel-collector-config.yaml"

    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro

    environment:  
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_FS=/host

    expose:
      - "4317"
      - "4318"
      - "8889"

    depends_on:
      - prometheus
      - loki

    logging:
      <<: *default-logging


volumes:
  grafana-data: