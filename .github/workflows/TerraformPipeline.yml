name: Terraform Deploy (Production)

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "terraform/**"
      - ".github/workflows/TerraformPipeline.yml"

permissions:
  id-token: write
  contents: read

jobs:

  # =========================================================
  # TERRAFORM PLAN
  # =========================================================
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: terraform

    outputs:
      tf_changes: ${{ steps.plan.outputs.changes }}
      has_destroy: ${{ steps.destroy_check.outputs.has_destroy }}

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # AWS AUTH
      # =========================================================
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # =========================================================
      # TERRAFORM SETUP
      # =========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # =========================================================
      # TERRAFORM FORMAT
      # =========================================================
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # =========================================================
      # TERRAFORM INIT
      # =========================================================
      - name: Terraform Init
        run: terraform init -reconfigure

      # =========================================================
      # TERRAFORM VALIDATE
      # =========================================================
      - name: Terraform Validate
        run: terraform validate

      # =========================================================
      # TERRAFORM PLAN
      # =========================================================
      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan \
            -input=false \
            -detailed-exitcode \
            -out=tfplan

          exit_code=$?

          echo "Terraform Exit Code: $exit_code"

          case $exit_code in
            0)
              echo "changes=false" >> $GITHUB_OUTPUT
              echo "No infrastructure changes detected"
              ;;
            1)
              echo "Terraform plan failed"
              exit 1
              ;;
            2)
              echo "changes=true" >> $GITHUB_OUTPUT
              echo "Infrastructure changes detected"
              ;;
            *)
              echo "Unknown Terraform exit code"
              exit 1
              ;;
          esac

      # =========================================================
      # CHECK FOR DESTROY OPERATIONS
      # =========================================================
      - name: Detect Destroy Operations
        id: destroy_check
        shell: bash
        run: |

          # Default value
          echo "has_destroy=false" >> $GITHUB_OUTPUT

          # Skip if no changes
          if [ "${{ steps.plan.outputs.changes }}" != "true" ]; then
            echo "No changes detected"
            exit 0
          fi

          terraform show -json tfplan > tfplan.json

          DESTROY_COUNT=$(jq '
            [
              .resource_changes[]
              | select(
                  (.change.actions | index("delete"))
                )
            ] | length
          ' tfplan.json)

          echo "Destroy Count: $DESTROY_COUNT"

          if [ "$DESTROY_COUNT" -gt 0 ]; then
            echo "has_destroy=true" >> $GITHUB_OUTPUT
            echo "Destroy operations detected"
          else
            echo "No destroy operations detected"
          fi

      # =========================================================
      # UPLOAD PLAN
      # =========================================================
      - name: Upload Terraform Plan
        if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan

  # =========================================================
  # TERRAFORM APPLY
  # =========================================================
  apply:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest
    environment: production

    if: |
      needs.plan.outputs.tf_changes == 'true' &&
      needs.plan.outputs.has_destroy != 'true'

    defaults:
      run:
        working-directory: terraform

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # AWS AUTH
      # =========================================================
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # =========================================================
      # TERRAFORM SETUP
      # =========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # =========================================================
      # TERRAFORM INIT
      # =========================================================
      - name: Terraform Init
        run: terraform init -reconfigure

      # =========================================================
      # DOWNLOAD PLAN
      # =========================================================
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      # =========================================================
      # TERRAFORM APPLY
      # =========================================================
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan