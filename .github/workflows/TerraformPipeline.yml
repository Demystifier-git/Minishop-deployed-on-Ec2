name: Terraform Deploy (Production)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Plan, Apply and Ansible Deployment
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: terraform

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_vpc_cidr: ${{ secrets.VPC_CIDR }}
      TF_VAR_ec2_ami: ${{ secrets.EC2_AMI }}

      TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
      TF_VAR_certificate_arn: ${{ secrets.CERTIFICATE_ARN }}
      TF_VAR_hosted_zone_id: ${{ secrets.HOSTED_ZONE_ID }}
      TF_VAR_subdomain: ${{ secrets.SUBDOMAIN }}

      TF_VAR_instance_type: ${{ secrets.INSTANCE_TYPE }}
      TF_VAR_desired_capacity: ${{ secrets.DESIRED_CAPACITY }}
      TF_VAR_max_size: ${{ secrets.MAX_SIZE }}
      TF_VAR_min_size: ${{ secrets.MIN_SIZE }}

      TF_VAR_db_name: ${{ secrets.DB_NAME }}
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_engine_version: ${{ secrets.DB_ENGINE_VERSION }}
      TF_VAR_db_instance_class: ${{ secrets.DB_INSTANCE_CLASS }}
      TF_VAR_db_allocated_storage: ${{ secrets.DB_ALLOCATED_STORAGE }}
      TF_VAR_availability_zones: ${{ secrets.AVAILABILITY_ZONES }}

      TF_VAR_environment: ${{ secrets.ENVIRONMENT }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}

      TF_VAR_ecr_repository_name: ${{ secrets.ECR_REPOSITORY_NAME }}
      TF_VAR_ecr_image_tag_mutability: ${{ secrets.ECR_IMAGE_TAG_MUTABILITY }}
      TF_VAR_ecr_scan_on_push: ${{ secrets.ECR_SCAN_ON_PUSH }}

      TF_VAR_secret_name: ${{ secrets.SECRET_NAME }}
      TF_VAR_secret_description: ${{ secrets.SECRET_DESCRIPTION }}
      TF_VAR_secret_recovery_window_in_days: ${{ secrets.SECRET_RECOVERY_WINDOW }}

      TF_VAR_grafana_admin_user: ${{ secrets.GRAFANA_ADMIN_USER }}
      TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      TF_VAR_grafana_root_url: ${{ secrets.GRAFANA_ROOT_URL }}

      TF_VAR_smtp_host: ${{ secrets.SMTP_HOST }}
      TF_VAR_smtp_user: ${{ secrets.SMTP_USER }}
      TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
      TF_VAR_smtp_from: ${{ secrets.SMTP_FROM }}
      TF_VAR_s3_bucket_domain_name: ${{ secrets.TF_VAR_s3_bucket_domain_name }}
      TF_VAR_logs_bucket_name: ${{ secrets.TF_VAR_logs_bucket_name }}


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out=tfplan
          exit_code=$?
          set -e

          if [ "$exit_code" -eq 1 ]; then
            echo "Terraform plan failed."
            exit 1
          fi

          if [ "$exit_code" -eq 0 ]; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Prevent destructive changes
        if: steps.plan.outputs.changes == 'true'
        shell: bash
        run: |
          terraform show -json tfplan > tfplan.json

          DESTROY_COUNT=$(jq '
            [.resource_changes[]
             | select(
                 (.change.actions | index("delete")) or
                 (.change.actions == ["create","delete"]) or
                 (.change.actions == ["delete","create"])
               )
            ] | length
          ' tfplan.json)

          if [ "$DESTROY_COUNT" -gt 0 ]; then
            echo "Destructive changes detected: $DESTROY_COUNT"
            exit 1
          fi

      - name: Upload Terraform Plan
        if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 7

      - name: Terraform Apply
        if: success()
        run: terraform apply -input=false -auto-approve tfplan

      - name: No Infrastructure Changes
        if: steps.plan.outputs.changes == 'false'
        run: echo "No infrastructure changes detected."

      # =========================
      # ANSIBLE CONFIGURATION
      # =========================

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Run Ansible Deploy Playbook
        working-directory: ansible
        run: |
          ansible-playbook -i inventory deploy.yml

      - name: Run Ansible Test Playbook
        working-directory: ansible
        run: |
          ansible-playbook -i inventory test.yml