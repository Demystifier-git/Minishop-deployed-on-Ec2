name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options:
          - backend
          - frontend
          - all

      version:
        description: "Docker image version (e.g. v1.1.0)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        env:
          SERVICE: ${{ github.event.inputs.service }}
          VERSION: ${{ github.event.inputs.version }}
          INSTANCE_ID: ${{ secrets.PROD_INSTANCE_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

        run: |

          COMMANDS='[
            "set -e",
            "cd /root/Minishop-deployed-on-Ec2/",
            "git pull",
            "export VERSION='"$VERSION"'",
            "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$ECR_REGISTRY"'"
          ]'

          if [ "$SERVICE" = "backend" ]; then

            COMMANDS=$(echo "$COMMANDS" | jq '. + [
              "docker pull '"$ECR_REGISTRY"'/minishop-backend:'"$VERSION"'",
              "docker compose up -d backend"
            ]')

          elif [ "$SERVICE" = "frontend" ]; then

            COMMANDS=$(echo "$COMMANDS" | jq '. + [
              "docker pull '"$ECR_REGISTRY"'/minishop-frontend:'"$VERSION"'",
              "docker compose up -d frontend"
            ]')

          else

            COMMANDS=$(echo "$COMMANDS" | jq '. + [
              "docker pull '"$ECR_REGISTRY"'/minishop-backend:'"$VERSION"'",
              "docker pull '"$ECR_REGISTRY"'/minishop-frontend:'"$VERSION"'",
              "docker compose up -d"
            ]')

          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $SERVICE $VERSION" \
            --parameters commands="$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"