name: Production Deploy to Private EC2 (Manual)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options:
          - backend
          - frontend
          - all

      branch:
        description: "Git branch to deploy"
        required: true
        default: "main"
        type: string

      version:
        description: "Semantic version tag (example: v1.0.0)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: ${{ secrets.PROD_INSTANCE_ID }}

  ECR_BACKEND_REPO: minishop-backend
  ECR_FRONTEND_REPO: minishop-frontend

jobs:
  deploy:
    name: Build, Push to ECR and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:

      # ------------------------
      # Checkout Code
      # ------------------------
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # ------------------------
      # Validate Version
      # ------------------------
      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version }}"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Version must follow v1.2.3 format"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # ------------------------
      # AWS Auth (OIDC)
      # ------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------
      # Login to ECR
      # ------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set registry
        run: |
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV

      # ==================================================
      # BACKEND
      # ==================================================

      - name: Build backend image
        if: github.event.inputs.service == 'backend' || github.event.inputs.service == 'all'
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$VERSION \
            ./backend

      - name: Push backend image
        if: github.event.inputs.service == 'backend' || github.event.inputs.service == 'all'
        run: |
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$VERSION

      # ==================================================
      # FRONTEND
      # ==================================================

      - name: Build frontend image
        if: github.event.inputs.service == 'frontend' || github.event.inputs.service == 'all'
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:$VERSION \
            ./frontend

      - name: Push frontend image
        if: github.event.inputs.service == 'frontend' || github.event.inputs.service == 'all'
        run: |
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:$VERSION

      # ==================================================
      # DEPLOY
      # ==================================================

      - name: Deploy to EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.event.inputs.service }} version $VERSION" \
            --parameters 'commands=[
              "cd /opt/minishop",
              "docker compose pull",
              "docker compose up -d"
            ]' \
            --region "$AWS_REGION"

    