name: Production Deploy to Private EC2 (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy"
        required: true
        default: "main"
        type: string

      version:
        description: "Semantic version tag (example: v1.0.0)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: ${{ secrets.PROD_INSTANCE_ID }}

  ECR_BACKEND_REPO: minishop-backend
  ECR_FRONTEND_REPO: minishop-frontend

jobs:
  deploy:
    name: Build, Push to ECR and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:

    # ------------------------
    # Checkout Code
    # ------------------------
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}

    # ------------------------
    # Validate Version
    # ------------------------
    - name: Validate version format
      run: |
        VERSION="${{ github.event.inputs.version }}"

        if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "ERROR: Version must follow v1.2.3 format"
          exit 1
        fi

        echo "VERSION=$VERSION" >> $GITHUB_ENV

    # ------------------------
    # AWS Auth (OIDC)
    # ------------------------
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    # ------------------------
    # Login to ECR
    # ------------------------
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set registry
      run: |
        echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV

    # ------------------------
    # Build Images (TAG = VERSION ONLY)
    # ------------------------
    - name: Build backend image
      run: |
        docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$VERSION ./backend

    - name: Build frontend image
      run: |
        docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:$VERSION ./frontend

    # ------------------------
    # Push Images (ONLY VERSION TAG)
    # ------------------------
    - name: Push backend image
      run: |
        docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$VERSION

    - name: Push frontend image
      run: |
        docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:$VERSION

    