name: Ansible Configuration Management (SSM)

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  ansible:
    name: Run Ansible via AWS SSM
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      # =========================================================
      # CHECKOUT REPOSITORY
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # CONFIGURE AWS CREDENTIALS (OIDC)
      # =========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # =========================================================
      # INSTALL ANSIBLE + AWS DEPENDENCIES
      # =========================================================
      - name: Install Ansible and Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            ansible \
            boto3 \
            botocore

      # =========================================================
      # INSTALL ANSIBLE COLLECTIONS
      # =========================================================
      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install \
            amazon.aws \
            community.aws

      # =========================================================
      # INSTALL AWS SESSION MANAGER PLUGIN
      # =========================================================
      - name: Install AWS Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o session-manager-plugin.deb

          sudo dpkg -i session-manager-plugin.deb

      # =========================================================
      # VERIFY SSM CONNECTIVITY
      # =========================================================
      - name: Verify EC2 connectivity through SSM
        run: |
          aws ssm describe-instance-information

      # =========================================================
      # RUN ANSIBLE PLAYBOOK THROUGH AWS SSM
      # =========================================================
      - name: Execute Ansible Playbook
        run: |
          ansible-playbook \
            -i ansible/inventory.aws_ec2.yml \
            ansible/playbook.yml