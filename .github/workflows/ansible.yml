name: Ansible Deployment via AWS SSM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ANSIBLE_COLLECTIONS_PATHS: /home/runner/.ansible/collections:/usr/share/ansible/collections

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    environment: production

    steps:

      # =========================================================
      # CHECKOUT REPOSITORY
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # CONFIGURE AWS CREDENTIALS
      # =========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # =========================================================
      # INSTALL ANSIBLE + AWS COLLECTION
      # =========================================================
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip

          pip install \
            "ansible==9.13.0" \
            "boto3>=1.34.0" \
            "botocore>=1.34.0"

          ansible-galaxy collection install amazon.aws --force

      # =========================================================
      # INSTALL SESSION MANAGER PLUGIN
      # =========================================================
      - name: Install AWS Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o session-manager-plugin.deb

          sudo dpkg -i session-manager-plugin.deb

          session-manager-plugin --version

      # =========================================================
      # VERIFY INVENTORY (YOUR FILE)
      # =========================================================
      - name: Verify Inventory
        run: |
          ansible-inventory -i ansible/inventory.ini --graph

      # =========================================================
      # RUN PLAYBOOK
      # =========================================================
      - name: Run Ansible Playbook
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml