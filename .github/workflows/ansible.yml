name: Ansible Configuration Management (SSM)

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  ansible:
    name: Run Ansible via AWS SSM
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      # =========================================================
      # CHECKOUT CODE
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # CONFIGURE AWS CREDENTIALS (OIDC)
      # =========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # =========================================================
      # INSTALL ANSIBLE + AWS DEPENDENCIES (FIXED)
      # =========================================================
      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            ansible \
            boto3 \
            botocore \
            awscli \
            session-manager-plugin

          # FIX: correct way to install AWS Ansible plugin
          ansible-galaxy collection install amazon.aws

      # =========================================================
      # VERIFY SSM INVENTORY ACCESS
      # =========================================================
      - name: Verify EC2 instances in SSM
        run: |
          aws ssm describe-instance-information

      # =========================================================
      # VALIDATE DYNAMIC INVENTORY
      # =========================================================
      - name: Test Ansible Inventory
        run: |
          ansible-inventory \
            -i ansible/inventory.aws_ec2.yml \
            --graph

      # =========================================================
      # RUN PLAYBOOK VIA SSM
      # =========================================================
      - name: Run Ansible Playbook (SSM)
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ansible.cfg
        run: |
          ansible-playbook \
            -i inventory.aws_ec2.yml \
            playbook.yml -vvv