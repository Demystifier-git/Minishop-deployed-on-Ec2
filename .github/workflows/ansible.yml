name: Ansible Configuration Management (SSM)

on:
  push:
    branches: [main]
    paths:
      - "ansible/**"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  ansible:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Ansible + AWS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore amazon.aws awscli session-manager-plugin
          ansible-galaxy collection install amazon.aws

      - name: Validate SSM inventory
        run: |
          ansible-inventory -i ansible/inventory.aws_ec2.yml --graph

      - name: Run playbook via SSM
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ansible.cfg
        run: |
          ansible-playbook \
            -i inventory.aws_ec2.yml \
            playbook.yml -vvv