name: Ansible Deployment via AWS SSM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    environment: production

    steps:
      # =========================================================
      # CHECKOUT REPOSITORY
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # CONFIGURE AWS CREDENTIALS
      # =========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # =========================================================
      # INSTALL ANSIBLE + AWS COLLECTIONS
      # =========================================================
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip

          pip install \
            "ansible==9.13.0" \
            "boto3>=1.34.0" \
            "botocore>=1.34.0"

          ansible-galaxy collection install amazon.aws

      # =========================================================
      # INSTALL SESSION MANAGER PLUGIN
      # =========================================================
      - name: Install AWS Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o session-manager-plugin.deb

          sudo dpkg -i session-manager-plugin.deb

          session-manager-plugin --version

      # =========================================================
      # GET INSTANCE ID
      # =========================================================
      - name: Fetch EC2 Instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text | head -n 1)

          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

          echo "Using instance: $INSTANCE_ID"

      # =========================================================
      # CREATE INVENTORY FILE
      # =========================================================
      - name: Generate Inventory File
        run: |
          cat > ansible/inventory.ini <<EOF
          [web]
          ${INSTANCE_ID}

          [web:vars]
          ansible_connection=amazon.aws.aws_ssm
          ansible_aws_ssm_region=us-east-1
          ansible_user=ubuntu
          ansible_python_interpreter=/usr/bin/python3
          EOF

      # =========================================================
      # VERIFY INVENTORY
      # =========================================================
      - name: Verify Inventory
        run: |
          ansible-inventory -i ansible/inventory.ini --graph

      # =========================================================
      # RUN PLAYBOOK
      # =========================================================
      - name: Run Ansible Playbook
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml