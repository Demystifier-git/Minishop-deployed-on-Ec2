name: Ansible Configuration Management (SSM - Push Trigger)

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: ${{ secrets.PROD_INSTANCE_ID }}

jobs:
  ansible:
    name: Run Ansible via SSM
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:

      # =========================================================
      # CHECKOUT CODE
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

    
      # CONFIGURE AWS (OIDC - NO STATIC KEYS)
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # VALIDATE INSTANCE REACHABILITY (SSM CHECK)
      
      - name: Check SSM connectivity
        run: |
          aws ssm describe-instance-information \
            --filters Key=InstanceIds,Values=$INSTANCE_ID

     
      # SEND ANSIBLE EXECUTION VIA SSM
      
      - name: Run Ansible Playbook via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Ansible configuration deployment via GitHub Actions" \
            --parameters "commands=[
              \"set -e\",

              \"echo 'Updating system packages...'\",
              \"sudo apt update -y\",

              \"echo 'Installing Ansible if not present...'\",
              \"if ! command -v ansible &> /dev/null; then sudo apt install -y ansible; fi\",

              \"echo 'Navigating to app directory...'\",
              \"cd /opt/minishop || exit 1\",

              \"echo 'Pulling latest repo (if needed)...'\",
              \"if [ ! -d .git ]; then git clone https://github.com/Demystifier-git/Minishop-deployed-on-Ec2.git .; else git pull; fi\",

              \"cd ansible\",

              \"echo 'Running Ansible playbook...'\",
              \"ansible-playbook -i inventory.ini playbook.yml\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

     
      # WAIT FOR COMPLETION
     
      - name: Wait for SSM command to finish
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

      # FETCH OUTPUT LOGS
      
      - name: Show execution logs
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text