name: Ansible Deploy (SSM + EC2 Inventory)

on:
  push:
    branches: [main]
    paths:
      - "ansible/**"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 🔥 THIS IS THE FIX YOU WERE MISSING
      - name: Install Ansible + AWS collection
        run: |
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws

      # 🔥 Verify inventory works BEFORE running playbook
      - name: Test inventory
        run: |
          ansible-inventory -i ansible/inventory.aws_ec2.yml --graph

      # 🔥 Run playbook
      - name: Run playbook
        run: |
          ansible-playbook -i ansible/inventory.aws_ec2.yml ansible/playbook.yml