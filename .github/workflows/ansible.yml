name: Ansible Configuration Management (SSM)

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  ansible:
    name: Run Ansible via AWS SSM
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # AWS AUTH (OIDC)
      # =========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # =========================================================
      # INSTALL ANSIBLE + AWS DEPENDENCIES (FIXED)
      # =========================================================
      - name: Install Ansible and AWS tools
        run: |
          python -m pip install --upgrade pip

          pip install \
            ansible \
            boto3 \
            botocore \
            awscli

          # Install AWS Ansible collection (CORRECT)
          ansible-galaxy collection install amazon.aws

          # Install AWS Session Manager Plugin (CORRECT WAY)
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o session-manager-plugin.deb

          sudo dpkg -i session-manager-plugin.deb || sudo apt-get install -f -y

          session-manager-plugin --version

      # =========================================================
      # VERIFY SSM CONNECTIVITY
      # =========================================================
      - name: Verify SSM managed instances
        run: |
          aws ssm describe-instance-information

      # =========================================================
      # VALIDATE INVENTORY
      # =========================================================
      - name: Validate Ansible inventory
        run: |
          ansible-inventory \
            -i ansible/inventory.aws_ec2.yml \
            --graph

      # =========================================================
      # RUN PLAYBOOK VIA SSM
      # =========================================================
      - name: Run Ansible Playbook (SSM)
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ansible.cfg
        run: |
          ansible-playbook \
            -i inventory.aws_ec2.yml \
            playbook.yml -vvv