name: Ansible Deployment via AWS SSM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    environment: production

    steps:

      # =========================================================
      # Checkout repo
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # AWS authentication
      # =========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # =========================================================
      # Install Ansible (FIXED versions)
      # =========================================================
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip

          pip install \
            "ansible==9.3.0" \
            "ansible-core==2.16.4" \
            "boto3>=1.34.0" \
            "botocore>=1.34.0"

          ansible-galaxy collection install amazon.aws:8.0.0 --force

      # =========================================================
      # Install SSM plugin
      # =========================================================
      - name: Install AWS Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o session-manager-plugin.deb

          sudo dpkg -i session-manager-plugin.deb

          session-manager-plugin --version

      # =========================================================
      # Verify inventory
      # =========================================================
      - name: Verify Inventory
        run: |
          ansible-inventory -i ansible/inventory.ini --graph

      # =========================================================
      # Run playbook
      # =========================================================
      - name: Run Ansible Playbook
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml